name: Build Neovim ARM64 (Debian 14 Forky)

on:
  workflow_dispatch:          # manual
  repository_dispatch:        # auto dari upstream
    types: [neovim-release]
  schedule:                   # setiap Minggu jam 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Get Latest Neovim Version
        id: version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/neovim/neovim/releases/latest | jq -r .tag_name)
          echo "LATEST=$LATEST" >> $GITHUB_ENV
          echo "Latest Neovim version: $LATEST"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Paksa pakai Node 22 supaya warning "Node.js 20 is deprecated" hilang
          # (opsional, tapi bagus)
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Build Neovim ARM64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg NEOVIM_VERSION=${{ env.LATEST }} \
            --output type=local,dest=./out \
            --progress=plain \
            .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvim-arm64-${{ env.LATEST }}
          path: |
            out/nvim-arm64.tar.gz
            out/sha256.txt
          if-no-files-found: error

      - name: Create Tag
        run: |
          TAG="${LATEST}-arm64"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${TAG}" -m "Neovim ARM64 ${LATEST}"
          git push origin "${TAG}" --force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST }}-arm64
          name: Neovim ARM64 ${{ env.LATEST }}
          generate_release_notes: true
          files: |
            out/nvim-arm64.tar.gz
            out/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opsional: publish ke Docker Hub
      - name: Publish Docker Image (optional)
        if: false   # ganti jadi true kalau mau aktifkan
        run: |
          echo "\( {{ secrets.DOCKER_PASSWORD }}" | docker login -u " \){{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker buildx build \
            --platform linux/arm64 \
            --build-arg NEOVIM_VERSION=${{ env.LATEST }} \
            -t \( {{ secrets.DOCKER_USERNAME }}/nvim-arm64: \){{ env.LATEST }} \
            -t ${{ secrets.DOCKER_USERNAME }}/nvim-arm64:latest \
            --push \
            .
